name: Nix Flake Check

on:
    pull_request:
        paths:
            - 'flake.nix'
            - 'flake.lock'
            - '.github/workflows/nix-flake-check.yml'
    push:
        branches:
            - main
        paths:
            - 'flake.nix'
            - 'flake.lock'
    workflow_dispatch:

permissions:
    contents: read

jobs:
    flake-check:
        name: Nix Flake Validation
        runs-on: ubuntu-24.04
        
        steps:
            - name: 🧾 Checkout repository
              uses: actions/checkout@v4

            - name: 📦 Install Nix
              uses: cachix/install-nix-action@v27
              with:
                  nix_path: nixpkgs=channel:nixos-unstable
                  extra_nix_config: |
                      experimental-features = nix-command flakes
                      accept-flake-config = true

            - name: 🔧 Configure Nix substituters
              run: |
                  mkdir -p ~/.config/nix
                  cat > ~/.config/nix/nix.conf <<EOF
                  experimental-features = nix-command flakes
                  substituters = https://cache.nixos.org
                  trusted-public-keys = cache.nixos.org-1:6NCHdD59X431o0gWypbMrAURkbJ16ZPMQFGspcDShjY=
                  EOF

            - name: ✅ Run flake check
              run: nix flake check --show-trace --print-build-logs

            - name: 🔍 Validate flake metadata
              run: nix flake metadata --json | jq

            - name: 📋 Show flake outputs
              run: nix flake show

            - name: 🧪 Test package build
              run: nix build .#geforce-infinity --print-build-logs

            - name: 🎯 Run specific checks
              run: |
                  echo "Running flake structure validation..."
                  nix build .#checks.x86_64-linux.flake-structure --print-build-logs
                  
                  echo "Running configuration validation..."
                  nix build .#checks.x86_64-linux.config-validation --print-build-logs

            - name: 📊 Check summary
              run: |
                  echo "## Nix Flake Check Summary" >> $GITHUB_STEP_SUMMARY
                  echo "✅ Flake validation passed" >> $GITHUB_STEP_SUMMARY
                  echo "✅ Package builds successfully" >> $GITHUB_STEP_SUMMARY
                  echo "✅ Configuration validation passed" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Flake Outputs" >> $GITHUB_STEP_SUMMARY
                  nix flake show >> $GITHUB_STEP_SUMMARY || true

    module-validation:
        name: Module Documentation Check
        runs-on: ubuntu-24.04
        
        steps:
            - name: 🧾 Checkout repository
              uses: actions/checkout@v4

            - name: 📦 Install Nix
              uses: cachix/install-nix-action@v27
              with:
                  nix_path: nixpkgs=channel:nixos-unstable
                  extra_nix_config: |
                      experimental-features = nix-command flakes
                      accept-flake-config = true

            - name: 📋 Verify module options documentation
              run: |
                  echo "Checking that NIX.md documents validation..."
                  grep -q "Configuration Validation" NIX.md || exit 1
                  grep -q "1366x768" NIX.md || exit 1
                  grep -q "1920x1080" NIX.md || exit 1
                  grep -q "2560x1440" NIX.md || exit 1
                  echo "✅ Documentation includes all validation requirements"

            - name: 🧪 Verify flake provides checks
              run: |
                  nix flake show --json | jq -e '.checks."x86_64-linux".build' || exit 1
                  nix flake show --json | jq -e '.checks."x86_64-linux"."config-validation"' || exit 1
                  echo "✅ Flake provides required checks"

            - name: 📊 Module validation summary
              run: |
                  echo "## Module Validation Summary" >> $GITHUB_STEP_SUMMARY
                  echo "✅ Module structure validated" >> $GITHUB_STEP_SUMMARY
                  echo "✅ Documentation verified" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "### Validation Features" >> $GITHUB_STEP_SUMMARY
                  echo "- Assertions for resolution combinations (1366x768, 1920x1080, 2560x1440)" >> $GITHUB_STEP_SUMMARY
                  echo "- Assertions for FPS values (30, 60, 120)" >> $GITHUB_STEP_SUMMARY
                  echo "- Assertions for accent color format (hex or empty)" >> $GITHUB_STEP_SUMMARY
                  echo "- Assertions for NixGL integration" >> $GITHUB_STEP_SUMMARY
                  echo "" >> $GITHUB_STEP_SUMMARY
                  echo "Note: Assertion validation occurs during NixOS/Home Manager evaluation" >> $GITHUB_STEP_SUMMARY
