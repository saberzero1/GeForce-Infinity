name: Copilot Agent Setup

on:
    pull_request:
    workflow_dispatch:

permissions:
    contents: read

jobs:
    setup-environment:
        runs-on: ubuntu-24.04
        
        steps:
            - name: 🧾 Checkout repository
              uses: actions/checkout@v4

            - name: 🛠️ Setup Bun
              uses: oven-sh/setup-bun@v1
              with:
                  bun-version: "1.3.4"

            - name: ⚙️ Set up Node.js
              uses: actions/setup-node@v4
              with:
                  node-version: "22"

            - name: 🧰 Install dependencies
              run: bun install --ignore-scripts

            - name: 🏗️ Build application
              run: bun run build

            - name: ✅ Verify build output
              run: |
                  echo "Verifying dist directory structure..."
                  test -d dist/assets || exit 1
                  test -d dist/electron || exit 1
                  test -d dist/overlay || exit 1
                  test -d dist/shared || exit 1
                  echo "Build verification successful!"

            - name: 📦 Install Nix
              uses: cachix/install-nix-action@v27
              with:
                  nix_path: nixpkgs=channel:nixos-unstable
                  extra_nix_config: |
                      experimental-features = nix-command flakes
                      accept-flake-config = true

            - name: 🔍 Validate Nix Flake
              run: |
                  echo "Validating Nix flake structure..."
                  nix flake check --no-build || echo "⚠️  Flake check skipped (Nix environment may not be fully configured)"
                  nix flake metadata || echo "⚠️  Flake metadata not available"

            - name: 📊 Build summary
              run: |
                  echo "## Build Summary" >> $GITHUB_STEP_SUMMARY
                  echo "✅ Dependencies installed successfully" >> $GITHUB_STEP_SUMMARY
                  echo "✅ Build completed successfully" >> $GITHUB_STEP_SUMMARY
                  echo "✅ All output directories verified" >> $GITHUB_STEP_SUMMARY
                  echo "✅ Nix environment configured" >> $GITHUB_STEP_SUMMARY
